<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500|Roboto:300,400,500&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

    <title>Exercises </title>
    <style>
      .app{
        background-color: black;

        width: 100vw;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      header{
        text-align: center;
      }

      header span{
        font-family: "Jersey 15", serif;
        font-size: 250px;
        text-align: center;
        padding: 30px;

        margin: 0 auto;
      }

      main p{
        font-family: "Nunito", serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-size: 30px;
        color: white;

        padding: 20px;
      }

      .hero{
        display: flex;
        flex-direction: column;
        gap: 40px;

        justify-content: space-around;


      }

      section{
        display: flex;
        flex-direction: row;
        justify-content: space-evenly;
        align-items: center;
        color: white;

        padding-top: 30px;

        border-radius: 100px;
      }

      section ul{
        font-family: "Nunito", serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-style: normal;
        font-size: 20px;
        line-height: 23px;
      }

      @media screen and (max-width: 768px) {


        :root{
          font-size: 16.5%;

        }

        body{
          font-size: 16px;
        }
        .app{
          background-color: black;
  
          width: 100vw;
          height: 100%;
          margin: 0;
          padding: 0;
        }

        header span{
          font-family: "Jersey 15", serif;
          font-size: 20rem;
          line-height: 20px;
          text-align: center;
          font-weight: 200;

          padding: 30px;

          margin: 0 auto;
        }

        main p{
          font-size: 15px;
          padding: 20px;
        }

        section{
          display: flex;
          flex-direction: column;
          justify-content: space-evenly;
          align-items: center;
          color: white;
  
          border-radius: 100px;
        }

      }

      @media screen and (max-width: 540px) {
        header span{
          font-family: "Jersey 15", serif;
          font-size: 11rem;
          line-height: 20px;
          text-align: center;
          font-weight: 200;

          padding: 30px;

          margin: 0 auto;
        }
      }

    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
